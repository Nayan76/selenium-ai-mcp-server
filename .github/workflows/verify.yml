name: Verify Selenium MCP
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      additional_browser:
        description: Additional regression browser
        type: choice
        options: [none, firefox, edge]
        default: none

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.additional_browser == 'edge' && '[{"browser":"chrome","os":"ubuntu-24.04"},{"browser":"edge","os":"windows-2025"}]' || inputs.additional_browser == 'firefox' && '[{"browser":"chrome","os":"ubuntu-24.04"},{"browser":"firefox","os":"ubuntu-24.04"}]' || '[{"browser":"chrome","os":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      TEST_BROWSER: ${{ matrix.browser }}
      SELENIUM_CLEANUP_ON_EXIT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+1.2'
      - name: Verify patched Java 21 runtime
        run: |
          $versionOutput = & java -version 2>&1
          $javaExitCode = $LASTEXITCODE
          $version = [string]($versionOutput | Select-Object -First 1)
          if ($javaExitCode -ne 0 -or $version -notmatch '^openjdk version "21\.0\.13\.1"') {
            throw "Expected Temurin Java 21.0.13.1. Actual: $version"
          }
      - name: Verify with headless browser
        run: mvn -B -ntp "-Dbrowser.test=$env:TEST_BROWSER" verify
      - name: Smoke test packaged stdio server
        run: node scripts/smoke-stdio.mjs
      - name: Inventory dependencies
        if: matrix.browser == 'chrome'
        run: mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.7.0:tree "-DoutputType=json" "-DoutputFile=target/dependencies.json"
      - name: Check advisory database
        if: matrix.browser == 'chrome'
        run: ./scripts/audit-dependencies.ps1
      - name: Collect test counts
        if: always()
        run: |
          if (Test-Path target/surefire-reports) {
            Get-ChildItem target/surefire-reports -Filter '*.txt' |
              Select-String '^Tests run: \d+, Failures: \d+, Errors: \d+, Skipped: \d+' |
              ForEach-Object { "$($_.Filename) $($_.Matches.Value)" } | Set-Content target/test-counts.txt
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-counts-${{ matrix.browser }}
          path: target/test-counts.txt
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && matrix.browser == 'chrome'
        with:
          name: selenium-mcp-java21
          path: target/selenium-mcp-0.5.0.jar
          retention-days: 7
          if-no-files-found: error
