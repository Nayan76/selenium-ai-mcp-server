name: Verify Selenium MCP
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: ubuntu-24.04
          - browser: firefox
            os: ubuntu-24.04
          - browser: edge
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      TEST_BROWSER: ${{ matrix.browser }}
      SELENIUM_CLEANUP_ON_EXIT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+1.2'
      - name: Verify patched Java 21 runtime
        run: |
          $versionOutput = & java -version 2>&1
          $javaExitCode = $LASTEXITCODE
          $version = [string]($versionOutput | Select-Object -First 1)
          if ($javaExitCode -ne 0 -or $version -notmatch '^openjdk version "21\.0\.(\d+)(?:\.\d+)*"' -or [int]$Matches[1] -lt 5) {
            throw "Browser and API tests require patched Java 21 (21.0.5 or later). Actual: $version"
          }
      - name: Verify with headless browser
        run: |
          if ($IsWindows) {
            # The runner's default Java temp path can use an alias rejected by artifact validation.
            $testTemp = Join-Path $env:LOCALAPPDATA "selenium-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
            $env:TEMP = $testTemp
            $env:TMP = $testTemp
          }
          $mavenLog = Join-Path $env:RUNNER_TEMP 'selenium-verify.log'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            mvn -B -ntp "-Dbrowser.test=$env:TEST_BROWSER" verify 2>&1 | Tee-Object -FilePath $mavenLog
            $result = $LASTEXITCODE
            if ($result -eq 0) { exit 0 }
            $rateLimited = Select-String -Quiet -Path $mavenLog -Pattern 'repo\.maven\.apache\.org/maven2.*(?:HTTP Status: 429|status code: 429)'
            if (!$rateLimited -or $attempt -eq 3) { exit $result }
            Start-Sleep -Seconds (10 * $attempt)
          }
      - name: Smoke test packaged stdio server
        run: |
          if ($IsWindows) {
            $env:SELENIUM_ARTIFACT_DIR = Join-Path $env:LOCALAPPDATA "selenium-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
          $install = Join-Path (Resolve-Path 'target').Path 'Smoke Install'
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          $jar = Join-Path $install 'selenium-mcp-0.6.0.jar'
          Copy-Item target/selenium-mcp-0.6.0.jar $jar
          node scripts/check-doctor.mjs $jar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-stdio.mjs $jar --examples
      - name: Inventory dependencies
        if: matrix.browser == 'chrome'
        run: mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.7.0:tree "-DoutputType=json" "-DoutputFile=target/dependencies.json"
      - name: Check advisory database
        if: matrix.browser == 'chrome'
        run: ./scripts/audit-dependencies.ps1
      - name: Collect test counts
        if: always()
        run: |
          if (Test-Path target/surefire-reports) {
            Get-ChildItem target/surefire-reports -Filter '*.txt' |
              Select-String '^Tests run: \d+, Failures: \d+, Errors: \d+, Skipped: \d+' |
              ForEach-Object { "$($_.Filename) $($_.Matches.Value)" } | Set-Content target/test-counts.txt
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-counts-${{ matrix.browser }}
          path: target/test-counts.txt
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && matrix.browser == 'chrome'
        with:
          name: selenium-mcp-java21
          path: target/selenium-mcp-0.6.0.jar
          retention-days: 7
          if-no-files-found: error
